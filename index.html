
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Assistant</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #101827;
  color: white;
}
header {
  background: #673de6;
  padding: 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}
.container {
  padding: 15px;
  max-width: 650px;
  margin: auto;
}
#chat {
  height: 55vh;
  overflow-y: auto;
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
}
.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.user {
  background: #673de6;
  text-align: right;
}
.bot {
  background: #334155;
}
input, button {
  padding: 13px;
  border-radius: 9px;
  border: none;
  margin-top: 10px;
  box-sizing: border-box;
}
#question {
  width: 75%;
}
button {
  background: #00d4ff;
  font-weight: bold;
  cursor: pointer;
}
#key {
  width: 100%;
  background: white;
}
</style>
</head>

<body>

<header>🤖 My AI Assistant</header>

<div class="container">

<h3>अपना AI API Key डालें</h3>
<input id="key" type="password"
placeholder="Gemini API Key डालें">

<div id="chat">
<div class="message bot">
नमस्ते! 😊 मैं तुम्हारा AI Assistant हूँ।
मुझसे कोई भी सवाल पूछो!
</div>
</div>

<input id="question"
placeholder="अपना सवाल लिखें...">

<button onclick="askAI()">Send 🚀</button>
<button onclick="clearChat()">New Chat</button>

</div>

<script>
async function askAI() {
  const key = document.getElementById("key").value.trim();
  const question = document.getElementById("question").value.trim();
  const chat = document.getElementById("chat");

  if (!key) {
    alert("पहले Gemini API Key डालें!");
    return;
  }

  if (!question) return;

  chat.innerHTML +=
    '<div class="message user"></div>';

  chat.lastElementChild.textContent = question;

  document.getElementById("question").value = "";

  const loading = document.createElement("div");
  loading.className = "message bot";
  loading.textContent = "AI जवाब सोच रहा है...";
  chat.appendChild(loading);
  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(key),
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: question
            }]
          }]
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "API Error");
    }

    loading.textContent =
      data.candidates?.[0]?.content?.parts?.[0]?.text
      || "जवाब नहीं मिला।";

  } catch (error) {
    loading.textContent = "Error: " + error.message;
  }

  chat.scrollTop = chat.scrollHeight;
}

function clearChat() {
  document.getElementById("chat").innerHTML =
    '<div class="message bot">नमस्ते! नया सवाल पूछो 😊</div>';
}
</script>

</body>
  </html>
